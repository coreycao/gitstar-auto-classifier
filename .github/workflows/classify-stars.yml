name: Classify Starred Repos

on:
  schedule:
    # Weekly on Monday at 3 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Re-classify all repos, not just new ones'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run classifier
        env:
          GH_USERNAME: ${{ vars.GH_USERNAME || github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
        run: node src/main.js

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update starred repo classifications [skip ci]'
          file_pattern: 'data/classifications.json README.md'
