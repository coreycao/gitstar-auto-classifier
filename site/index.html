<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⭐ GitHub Star Classifier</title>
<style>
  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-card: #1a1a28;
    --bg-card-hover: #22223a;
    --border: #2a2a3e;
    --text-primary: #e8e8f0;
    --text-secondary: #8888a8;
    --text-muted: #5a5a78;
    --accent: #6c5ce7;
    --accent-light: #a29bfe;
    --accent-glow: rgba(108, 92, 231, 0.15);
    --gradient-1: #6c5ce7;
    --gradient-2: #fd79a8;
    --gradient-3: #00cec9;
    --success: #00b894;
    --warning: #fdcb6e;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
    border-bottom: 1px solid var(--border);
    padding: 2.5rem 1.5rem 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
  }

  .header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--gradient-1), var(--gradient-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.3rem;
  }

  .header .subtitle {
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin-bottom: 1.2rem;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }

  .stat-pill {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.35rem 0.9rem;
    font-size: 0.82rem;
    color: var(--text-secondary);
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }

  .stat-pill strong {
    color: var(--text-primary);
    font-weight: 600;
  }

  /* Search */
  .search-box {
    position: relative;
    max-width: 400px;
  }

  .search-box input {
    width: 100%;
    padding: 0.6rem 1rem 0.6rem 2.4rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .search-box input::placeholder { color: var(--text-muted); }

  .search-box::before {
    content: '🔍';
    position: absolute;
    left: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.85rem;
    pointer-events: none;
  }

  /* Main layout */
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1.5rem;
  }

  /* Category sidebar + content grid */
  .layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 1.5rem;
    align-items: start;
  }

  @media (max-width: 768px) {
    .layout {
      grid-template-columns: 1fr;
    }
    .sidebar { order: -1; }
    .sidebar-inner {
      display: flex;
      overflow-x: auto;
      gap: 0.5rem;
      padding-bottom: 0.5rem;
      -webkit-overflow-scrolling: touch;
    }
    .sidebar-inner::-webkit-scrollbar { height: 4px; }
    .sidebar-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .cat-btn { white-space: nowrap; }
  }

  /* Sidebar categories */
  .sidebar-inner {
    position: sticky;
    top: 140px;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .cat-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 0.75rem;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
  }

  .cat-btn:hover {
    background: var(--bg-card);
    color: var(--text-primary);
  }

  .cat-btn.active {
    background: var(--accent-glow);
    border-color: var(--accent);
    color: var(--accent-light);
    font-weight: 500;
  }

  .cat-btn .count {
    font-size: 0.75rem;
    background: var(--bg-card);
    padding: 0.1rem 0.5rem;
    border-radius: 10px;
    min-width: 24px;
    text-align: center;
  }

  .cat-btn.active .count {
    background: var(--accent);
    color: #fff;
  }

  /* Repo grid */
  .repo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 0.75rem;
  }

  .repo-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.1rem;
    transition: all 0.2s;
    cursor: default;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .repo-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }

  .repo-card .repo-name {
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: color 0.15s;
  }

  .repo-card .repo-name:hover {
    color: var(--accent-light);
  }

  .repo-card .repo-name .fork-badge {
    font-size: 0.65rem;
    background: var(--text-muted);
    color: var(--bg-primary);
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    font-weight: 600;
    text-transform: uppercase;
  }

  .repo-card .summary {
    font-size: 0.83rem;
    color: var(--text-secondary);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .repo-card .meta {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.78rem;
    color: var(--text-muted);
    flex-wrap: wrap;
  }

  .repo-card .meta span {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
  }

  .repo-card .tags {
    display: flex;
    gap: 0.3rem;
    flex-wrap: wrap;
  }

  .repo-card .tag {
    font-size: 0.7rem;
    padding: 0.15rem 0.5rem;
    border-radius: 10px;
    background: rgba(108, 92, 231, 0.12);
    color: var(--accent-light);
    border: 1px solid rgba(108, 92, 231, 0.2);
  }

  /* Language colors */
  .lang-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text-muted);
  }

  .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
  .empty-state p { font-size: 0.95rem; }

  /* Footer */
  .footer {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--text-muted);
    font-size: 0.8rem;
    border-top: 1px solid var(--border);
    margin-top: 3rem;
  }

  .footer a {
    color: var(--accent-light);
    text-decoration: none;
  }

  /* Fade-in animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .repo-card {
    animation: fadeIn 0.3s ease-out both;
  }

  /* Loading */
  .loading {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 50vh;
    flex-direction: column;
    gap: 1rem;
    color: var(--text-muted);
  }

  .loading .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <h1>⭐ GitHub Star Classifier</h1>
    <div class="subtitle" id="subtitle">Loading...</div>
    <div class="stats-bar" id="stats-bar"></div>
    <div class="search-box">
      <input type="text" id="search" placeholder="Search repos, languages, categories..." autocomplete="off" />
    </div>
  </div>
</div>

<div class="main">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <span>Loading classifications...</span>
  </div>
  <div class="layout" id="app" style="display:none;">
    <aside class="sidebar">
      <div class="sidebar-inner" id="categories"></div>
    </aside>
    <div>
      <div class="repo-grid" id="repos"></div>
      <div class="empty-state" id="empty" style="display:none;">
        <div class="icon">🔍</div>
        <p>No repos match your search.</p>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  Generated by <a href="https://github.com/coreycao/gitstar-auto-classifier" target="_blank">gitstar-auto-classifier</a>
  · Powered by DeepSeek LLM
</div>

<script>
const LANG_COLORS = {
  'JavaScript': '#f1e05a', 'TypeScript': '#3178c6', 'Python': '#3572A5',
  'Go': '#00ADD8', 'Rust': '#dea584', 'Java': '#b07219', 'C++': '#f34b7d',
  'C': '#555555', 'C#': '#178600', 'Ruby': '#701516', 'PHP': '#4F5D95',
  'Swift': '#F05138', 'Kotlin': '#A97BFF', 'Dart': '#00B4AB',
  'Shell': '#89e051', 'HTML': '#e34c26', 'CSS': '#563d7c',
  'Vue': '#41b883', 'Svelte': '#ff3e00', 'Scala': '#c22d40',
  'Jupyter Notebook': '#DA5B0B', 'Dockerfile': '#384d54',
  'Lua': '#000080', 'Zig': '#ec915c', 'Elixir': '#6e4a7e',
  'Objective-C': '#438eff', 'Perl': '#0298c3', 'R': '#198CE7',
};

let DATA = null;
let activeCategory = 'All';
let searchQuery = '';

async function init() {
  try {
    const res = await fetch('data/classifications.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    DATA = await res.json();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = '';
    render();
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<div style="color:var(--gradient-2)">Failed to load data: ${e.message}</div>`;
  }
}

function getCategories() {
  const counts = {};
  let total = 0;
  for (const repo of Object.values(DATA.repos)) {
    total++;
    for (const cat of repo.categories || []) {
      counts[cat] = (counts[cat] || 0) + 1;
    }
  }
  return { counts, total };
}

function getFilteredRepos() {
  let repos = Object.entries(DATA.repos).map(([name, r]) => ({ fullName: name, ...r }));

  if (activeCategory !== 'All') {
    repos = repos.filter(r => (r.categories || []).includes(activeCategory));
  }

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    repos = repos.filter(r =>
      r.fullName.toLowerCase().includes(q) ||
      (r.summary || '').toLowerCase().includes(q) ||
      (r.description || '').toLowerCase().includes(q) ||
      (r.language || '').toLowerCase().includes(q) ||
      (r.categories || []).some(c => c.toLowerCase().includes(q)) ||
      (r.topics || []).some(t => t.toLowerCase().includes(q))
    );
  }

  repos.sort((a, b) => (b.stargazers_count || 0) - (a.stargazers_count || 0));
  return repos;
}

function formatStars(n) {
  if (!n) return '0';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}

function render() {
  const { counts, total } = getCategories();

  // Subtitle
  const date = DATA.last_run ? new Date(DATA.last_run).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : 'N/A';
  document.getElementById('subtitle').textContent = `Last updated ${date}`;

  // Stats bar
  const catCount = Object.keys(counts).length;
  document.getElementById('stats-bar').innerHTML = `
    <span class="stat-pill">⭐ <strong>${total}</strong> repos</span>
    <span class="stat-pill">📂 <strong>${catCount}</strong> categories</span>
    <span class="stat-pill">🤖 Classified by DeepSeek</span>
  `;

  // Categories
  const catsHtml = [`<button class="cat-btn ${activeCategory === 'All' ? 'active' : ''}" onclick="selectCategory('All')">All <span class="count">${total}</span></button>`];
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  for (const [cat, count] of sorted) {
    catsHtml.push(`<button class="cat-btn ${activeCategory === cat ? 'active' : ''}" onclick="selectCategory('${cat.replace(/'/g, "\\'")}')">${cat} <span class="count">${count}</span></button>`);
  }
  document.getElementById('categories').innerHTML = catsHtml.join('');

  // Repos
  const repos = getFilteredRepos();
  const grid = document.getElementById('repos');
  const empty = document.getElementById('empty');

  if (repos.length === 0) {
    grid.innerHTML = '';
    empty.style.display = '';
  } else {
    empty.style.display = 'none';
    grid.innerHTML = repos.map((r, i) => {
      const langColor = LANG_COLORS[r.language] || '#8b8b8b';
      const tags = (r.categories || []).map(c => `<span class="tag">${c}</span>`).join('');
      const fork = r.fork ? '<span class="fork-badge">fork</span>' : '';
      return `
        <div class="repo-card" style="animation-delay: ${Math.min(i * 0.03, 0.5)}s">
          <a class="repo-name" href="${r.html_url}" target="_blank" rel="noopener">
            ${r.fullName} ${fork}
          </a>
          <div class="summary">${r.summary || r.description || ''}</div>
          <div class="meta">
            ${r.language ? `<span><span class="lang-dot" style="background:${langColor}"></span> ${r.language}</span>` : ''}
            <span>⭐ ${formatStars(r.stargazers_count)}</span>
          </div>
          <div class="tags">${tags}</div>
        </div>
      `;
    }).join('');
  }
}

function selectCategory(cat) {
  activeCategory = cat;
  render();
  // Scroll to top of repo grid on mobile
  if (window.innerWidth <= 768) {
    document.getElementById('repos').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

// Debounced search
let searchTimeout;
document.getElementById('search').addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchQuery = e.target.value.trim();
    render();
  }, 200);
});

// Init
init();
</script>

</body>
</html>
